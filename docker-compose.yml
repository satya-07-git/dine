version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: dine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dine_dev
    ports:
      - "5432:5432"
    volumes:
      - dine_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dine_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dine_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dine_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dine_postgres_data:
  dine_redis_data:
